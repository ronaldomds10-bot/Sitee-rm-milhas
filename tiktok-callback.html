<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autorização TikTok | RM Milhas</title>
<style>
  body{background:#060609;color:#F2EDE4;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.7;margin:0;padding:48px 20px;text-align:center;}
  main{max-width:640px;margin:0 auto;}
  h1{color:#C9A84C;font-size:1.6rem;}
  .code{display:inline-block;background:#101018;border:1px solid #C9A84C;border-radius:12px;padding:18px 24px;font-size:1.05rem;word-break:break-all;margin:18px 0;user-select:all;}
  .err{color:#ff8a8a;} small{color:#9A9288;}
</style>
</head>
<body><main>
<h1>Autorização TikTok — RM Milhas</h1>
<p id="msg">Lendo resposta…</p>
<div class="code" id="code" style="display:none"></div>
<p id="help" style="display:none">Copie esse código e envie no WhatsApp para concluir a conexão. Pode fechar esta página depois.</p>
<p class="err" id="err" style="display:none"></p>
<small>rmmilhas.vercel.app</small>
<script>
const p = new URLSearchParams(location.search);
const code = p.get('code'), err = p.get('error'), desc = p.get('error_description');
if (code) {
  document.getElementById('msg').textContent = 'Autorização recebida. Quase lá:';
  const c = document.getElementById('code'); c.style.display='inline-block'; c.textContent = code;
  document.getElementById('help').style.display='block';
} else if (err) {
  document.getElementById('msg').textContent = 'A autorização não foi concluída.';
  const e = document.getElementById('err'); e.style.display='block'; e.textContent = err + (desc ? ' — ' + desc : '');
} else {
  document.getElementById('msg').textContent = 'Página de retorno da autorização TikTok. Nada a fazer por aqui.';
}
</script>
</body></html>
